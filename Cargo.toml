[package]
name = "kore"
version = "0.1.0"
edition = "2024"
authors = [
    "Ryan Doughty <rdd4@rice.edu>",
]
description = "bacterial genome completeness estimation using core genomes"
keywords = ["bioinformatics", "genomics", "bacteria", "completeness", "core-genome"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0"
simplelog = "0.12"
anyhow = "1.0.98"
flate2 = "1.1.10"
rand = "0.10.3"
minimap2 = "0.1.31"
